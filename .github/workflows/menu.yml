name: Kindergarten menu

on:
  schedule:
    # 20:00 Europe/Warsaw = 18:00 UTC (summer) / 19:00 UTC (winter).
    # Run at both; the script only sends when Warsaw hour == 20.
    - cron: "0 18 * * 0-4"
    - cron: "0 19 * * 0-4"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Send menu
        env:
          CHANNELS: ${{ secrets.CHANNELS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python menu_notifier.py
          else
            python menu_notifier.py --only-at-hour 20
          fi
